# Админка сервера: отдельный vhost на IP.
# Проект admin в domains_app, зеркало IP; URL /{lang}/.
server {
    listen 80;
    server_name <ADMIN_IP>;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name <ADMIN_IP>;
    root /var/www/damoony.ru/www;
    index index.php;

    ssl_certificate     /etc/ssl/damoony-admin/admin.crt;
    ssl_certificate_key /etc/ssl/damoony-admin/admin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    allow <ALLOWED_IP>;
    allow 127.0.0.1;
    deny all;

    location /media/ {
        try_files $uri =404;
        expires 1h;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm-admin.sock;
    }
}
