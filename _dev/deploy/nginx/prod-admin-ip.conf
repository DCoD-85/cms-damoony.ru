# admin.damoony.ru / IP — отдельный вход в серверную админку.
# Замените <ADMIN_IP> и <ALLOWED_IP>.
server {
    listen 80;
    server_name <ADMIN_IP>;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name <ADMIN_IP>;
    root /var/www/damoony.ru/www;
    index index.php;

    # Для IP нужен отдельный сертификат (wildcard *.damoony.ru не покрывает IP).
    ssl_certificate     /etc/ssl/damoony-admin/admin.crt;
    ssl_certificate_key /etc/ssl/damoony-admin/admin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    allow <ALLOWED_IP>;
    allow 127.0.0.1;
    deny all;

    location /media/ {
        try_files $uri =404;
        expires 1h;
    }

    # Любой путь отдаёт admin.php; публичный index.php не участвует.
    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/admin.php;
        fastcgi_param SCRIPT_NAME /admin.php;
        fastcgi_pass unix:/run/php/php8.5-fpm-admin.sock;
    }
}
