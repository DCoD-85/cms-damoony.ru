# persona.damoony.ru — публичный вход/регистрация
server {
    listen 80;
    server_name persona.damoony.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name persona.damoony.ru;
    root /var/www/damoony.ru/www;
    index index.php index.html;

    ssl_certificate     /etc/ssl/damoony-wildcard/damoony.ru.crt;
    ssl_certificate_key /etc/ssl/damoony-wildcard/damoony.ru.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
    }
}
