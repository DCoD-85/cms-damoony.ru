; Отдельный php-fpm pool для админки.
; Требует пользователя damoony-admin и прав на config/ + var/.
[admin]
user = damoony-admin
group = damoony-admin
listen = /run/php/php8.5-fpm-admin.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = dynamic
pm.max_children = 5
pm.start_servers = 1
pm.min_spare_servers = 1
pm.max_spare_servers = 2
php_admin_value[disable_functions] = exec,shell_exec,proc_open,popen,passthru,system,pcntl_exec
php_admin_value[open_basedir] = /var/www/damoony.ru:/tmp
